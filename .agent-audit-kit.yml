# Configuration for agent-audit-kit (https://github.com/sattyamjjain/agent-audit-kit).
# See docs/security-evidence.md for the scan write-up.

# AAK-ANTHROPIC-SDK-001 (STDIO sanitizer): this rule targets MCP servers that build
# argv/shell commands from tool input without sanitizing them. This server has no
# such surface at all — grep the src/ tree for child_process, execFile, spawn, or
# exec: there are none. fetch_url performs exactly one operation, an HTTP(S) fetch
# through the hardened security/ guard; it never executes a command. The rule fires
# purely because StdioServerTransport is used, which this server must do to be an
# MCP server at all.
accepts_stdio_risk: true
justification: >
  No OS command execution or subprocess spawning exists in the server
  (verified: no child_process/execFile/spawn/exec usage in src/). The only
  child_process use is in scripts/ (release and smoke-test tooling run by
  maintainers and CI), which is not part of the published package.
  fetch_url's only side effect is an HTTP(S) fetch through the hardened
  security/ guard (see docs/threat-model.md). The
  command-injection-via-unsanitized-argv risk this rule targets has no
  applicable surface in this codebase.
