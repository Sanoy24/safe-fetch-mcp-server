name: Bug report
description: Something doesn't work as documented (not a security vulnerability).
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The fetch_url arguments and any SAFE_FETCH_* env vars you set. Don't include secrets or internal hostnames.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: safe-fetch-mcp-server version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node version, OS, MCP client, transport (stdio/http)
    validations:
      required: true
