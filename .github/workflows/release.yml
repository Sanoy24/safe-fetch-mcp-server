name: Release

# Runs when a version tag is pushed: `git tag v0.2.0 && git push origin v0.2.0`.
# It STAGES the version on npm; nothing goes live until a maintainer approves it on
# npmjs.com (with 2FA). After approving, run the "Post-release" workflow.
# One-time setup and the full sequence: RELEASING.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: node scripts/release-check.mjs --tag "${GITHUB_REF_NAME}"
      - run: npm run check
      - run: node scripts/smoke-pack.mjs
      - run: npm audit --audit-level=moderate

  stage-npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance; no npm token stored
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm >= 11.15.0; the runner's bundled npm may be older.
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm run build
      # The trusted publisher is stage-only: a direct `npm publish` would be refused.
      - run: npm stage publish --provenance --access public
      - name: Next step
        run: |
          {
            echo "### Staged ${GITHUB_REF_NAME} on npm — not live yet"
            echo ""
            echo "1. Approve it on npmjs.com (or: \`npm stage approve safe-fetch-mcp-server@${GITHUB_REF_NAME#v}\`)."
            echo "2. Then run the **Post-release** workflow for \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"
