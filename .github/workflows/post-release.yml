name: Post-release

# Run manually AFTER approving the staged npm version:
#   gh workflow run post-release.yml -f tag=v0.2.0
# Publishes to the MCP Registry (which needs the npm version to be live) and creates
# the GitHub release with the companion skill attached.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches package version
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/release-check.mjs --tag "$TAG"
      - name: Version is live on npm (staged version was approved)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          live="$(npm view "safe-fetch-mcp-server@${version}" version 2>/dev/null || true)"
          if [ "$live" != "$version" ]; then
            echo "::error::safe-fetch-mcp-server@${version} is not live on npm yet. Approve the staged version on npmjs.com first."
            exit 1
          fi

  publish-mcp-registry:
    needs: check-live
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # GitHub OIDC login for the io.github.Sanoy24/* namespace
    env:
      # "latest" until pinned: set to a reviewed release tag of
      # modelcontextprotocol/registry (e.g. "v1.2.3") to make releases reproducible.
      MCP_PUBLISHER_VERSION: latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Install mcp-publisher
        run: |
          if [ "$MCP_PUBLISHER_VERSION" = "latest" ]; then
            base="https://github.com/modelcontextprotocol/registry/releases/latest/download"
          else
            base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          fi
          curl -fsSL "${base}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: check-live
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - run: node scripts/release-check.mjs --notes > release-notes.md
      - name: Package the companion skill (SKILL.md at the zip root)
        run: cd skills/safe-web-fetch && zip -r "${GITHUB_WORKSPACE}/safe-web-fetch-skill.zip" .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: >
          gh release create "$TAG"
          --title "$TAG"
          --notes-file release-notes.md
          --verify-tag
          safe-web-fetch-skill.zip
